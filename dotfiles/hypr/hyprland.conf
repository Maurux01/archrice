# =============================================================================
# archrice · Hyprland Gruvbox Daily Driver — FASE 2
# =============================================================================
# Wayland-only · Gruvbox Dark · fast & light (no bounce, small blur, no shadows)
# Installs to: ~/.config/hypr/hyprland.conf
# =============================================================================

$terminal = kitty
$fileManager = thunar
$browser = firefox
$menu = wofi --show drun

# --- Monitor (override in monitors.conf) ---
monitor=,preferred,auto,1
source = ~/.config/hypr/monitors.conf

# --- Autostart ---
exec-once = swww-daemon                                          # wallpaper daemon (wallpaper set in FASE 5)
exec-once = waybar                                              # top bar
exec-once = swaync                                              # notifications
exec-once = nm-applet --indicator                               # network tray
exec-once = blueman-applet                                      # bluetooth tray
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1  # auth for nm/blueman
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = wl-paste --type text --watch cliphist store         # clipboard history
exec-once = wl-paste --type image --watch cliphist store

# --- Wayland environment ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland
env = MOZ_ENABLE_WAYLAND,1
env = SDL_VIDEODRIVER,wayland
env = _JAVA_AWT_WM_NONREPARENTING,1
env = CLUTTER_BACKEND,wayland

# --- Input ---
input {
    kb_layout = us
    # kb_layout = us,es          # uncomment for US+ES toggle (SUPER+K switches, see keybindings)
    follow_mouse = 1
    sensitivity = 0
    accel_profile = flat
    touchpad {
        natural_scroll = false
        tap-to-click = true
        disable_while_typing = true
    }
}

# --- Appearance (Gruvbox Dark) ---
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(d79921ee)      # Gruvbox yellow
    col.inactive_border = rgba(3c3836aa)    # Gruvbox bg1
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 8
    active_opacity = 1.0
    inactive_opacity = 1.0
    fullscreen_opacity = 1.0
    blur {
        enabled = true
        size = 5        # small = cheap on GPU
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
    shadow {
        enabled = false # off for performance
    }
}

# --- Animations: smooth & basic, NO bounce, short durations ---
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05   # smooth ease-out
    animation = windows, 1, 4, myBezier
    animation = windowsOut, 1, 4, myBezier
    animation = windowsMove, 1, 4, myBezier
    animation = fade, 1, 3, myBezier
    animation = border, 1, 4, myBezier
    animation = workspaces, 1, 3, myBezier, slide
    animation = specialWorkspace, 1, 3, myBezier, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
    focus_on_activate = true
}

gestures {
    workspace_swipe = true
}

# --- Keybinds + window rules ---
source = ~/.config/hypr/keybindings.conf
source = ~/.config/hypr/windowrules.conf

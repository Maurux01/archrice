# =============================================================================
# archrice · hyprlock — Gruvbox Dark, sin ataduras a un monitor concreto
# Instala en: ~/.config/hypr/hyprlock.conf
# `monitor =` vacío = se muestra en TODOS los monitores.
# =============================================================================

$font = JetBrainsMono Nerd Font
$bg   = rgba(40, 40, 40, 0.95)      # #282828
$bg1  = rgba(60, 56, 54, 1.0)       # #3c3836
$bg2  = rgba(80, 73, 69, 1.0)       # #504945
$fg   = rgba(235, 219, 178, 1.0)    # #ebdbb2
$gray = rgba(168, 153, 132, 1.0)    # #a89984
$yellow = rgba(215, 153, 33, 1.0)   # #d79921
$red    = rgba(204, 36, 29, 1.0)    # #cc241d
$green  = rgba(152, 151, 26, 1.0)   # #98971a

general {
    grace = 2
    hide_cursor = true
}

# Fondo Gruvbox (sin ruta de imagen: usa color sólido, ligero y siempre disponible)
background {
    monitor =
    color = $bg
}

# Hora
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 72
    font_family = $font
    position = 0, -90
    halign = center
    valign = center
}

# Usuario
label {
    monitor =
    text = $USER
    color = $yellow
    font_size = 20
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

# Campo de contraseña
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.64
    dots_center = true
    outer_color = $yellow
    inner_color = $bg1
    font_color = $fg
    fade_on_empty = true
    placeholder_text = <i>Contraseña…</i>
    fail_text = <i>$PAMFAIL ($ATTEMPTS)</i>
    hide_input = false
    check_color = $green
    fail_color = $red
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

# Texto inferior
label {
    monitor =
    text = Arch Linux · Hyprland
    color = $gray
    font_size = 14
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

# =============================================================================
# archrice · hypridle — bloqueo/apagado de pantalla por inactividad
# Instala en: ~/.config/hypr/hypridle.conf  (lo arranca hyprland.conf)
# =============================================================================

general {
    # Usar siempre hyprlock (config Gruvbox en ~/.config/hypr/hyprlock.conf)
    lock_cmd = hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5 min: bloquear sesión
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 7 min: apagar pantalla (DPMS), se restaura al mover el ratón / pulsar una tecla
listener {
    timeout = 420
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

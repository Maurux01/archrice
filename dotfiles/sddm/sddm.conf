# =============================================================================
# archrice · SDDM — Gruvbox Daily Driver (FASE 4)
# =============================================================================
# Deploy: sudo cp sddm.conf /etc/sddm.conf
#   (SDDM already enabled by install.sh: systemctl enable sddm)
#
# NOTE: the greeter backend stays default. The user SESSION is pure Wayland
# Hyprland via /usr/share/wayland-sessions/hyprland.desktop (shipped by the
# hyprland package). Greeter backend and session compositor are independent.
# =============================================================================

[Theme]
Current=sugar-candy
CursorTheme=Bibata-Modern-Classic
CursorSize=24
Font="JetBrainsMono Nerd Font"

[General]
HaltCommand=/usr/bin/systemctl poweroff
RebootCommand=/usr/bin/systemctl reboot
Numlock=on

[Users]
MaximumUid=60000
MinimumUid=1000
HideUsers=
HideShells=
RememberLastUser=true
RememberLastSession=true

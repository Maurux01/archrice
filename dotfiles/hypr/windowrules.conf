# =============================================================================
# archrice · Window rules — minimal, Wayland-only (FASE 2)
# =============================================================================
# See https://wiki.hyprland.org/Configuring/Window-Rules/
# =============================================================================

# --- Dialogs & tools float ---
windowrule = float, class:^(org\.pulseaudio\.pavucontrol|blueman-manager|nm-connection-editor|nm-applet)$
windowrule = center, class:^(org\.pulseaudio\.pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = float, class:^(polkit-gnome-authentication-agent-1|org\.kde\.polkit.*)$
windowrule = float, class:^(xdg-desktop-portal-gtk)$
windowrule = float, title:^(Open|Save As|Choose Files?|Authentication Required|File Operation Progress|Confirm.*)$
windowrule = float, title:^(About Mozilla Firefox|Library)$

# --- Picture-in-Picture ---
windowrule = float, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = pin, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = keepaspectratio, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = size 25%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$
windowrule = move 73% 72%, title:^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# --- Don't idle-sleep during fullscreen media ---
windowrule = idleinhibit fullscreen, class:^(mpv|vlc|firefox)$

# --- Subtle terminal transparency only (perf-safe, Gruvbox blends) ---
windowrule = opacity 0.95 0.95, class:^(kitty|Alacritty)$

# --- OBS: keep compositor out of the way, no rounding on capture sources ---
windowrule = noblur, class:^(com\.obsproject\.Studio)$

# =============================================================================
# archrice · Keybinds — SUPER based, Gruvbox Daily Driver (FASE 2)
# =============================================================================
# Only tools installed by install.sh (FASE 1): no external $scrPath scripts.
# =============================================================================

$mainMod = SUPER
$terminal = kitty
$fileManager = thunar
$browser = firefox

# ---------------- Apps ----------------
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, Space, exec, rofi -show drun
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, $browser --private-window
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, Y, exec, $terminal -e yazi
bind = $mainMod, Escape, exec, hyprlock

# OBS Studio: GUI / background-record toggle (~/.local/bin/obs-toggle.sh)
bind = $mainMod, O, exec, obs
bind = $mainMod SHIFT, O, exec, ~/.local/bin/obs-toggle.sh

# NOTE: uncomment if you enable a 2nd layout in input{} (e.g. us,es)
# bind = $mainMod SHIFT, K, exec, hyprctl switchxkblayout all next

# ---------------- Windows ----------------
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, M, fullscreen, 1                            # maximize
bind = $mainMod, P, pseudo                                  # pseudotile
bind = $mainMod, V, togglefloating
bind = $mainMod, T, togglesplit
bind = $mainMod, Tab, cyclenext

# Focus (arrows + vim keys, no duplicates)
bind = $mainMod, Left, movefocus, l
bind = $mainMod, Right, movefocus, r
bind = $mainMod, Up, movefocus, u
bind = $mainMod, Down, movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Move window (swap)
bind = $mainMod SHIFT, Left, movewindow, l
bind = $mainMod SHIFT, Right, movewindow, r
bind = $mainMod SHIFT, Up, movewindow, u
bind = $mainMod SHIFT, Down, movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize (repeat while held)
binde = $mainMod CTRL, Left, resizeactive, -30 0
binde = $mainMod CTRL, Right, resizeactive, 30 0
binde = $mainMod CTRL, Up, resizeactive, 0 -30
binde = $mainMod CTRL, Down, resizeactive, 0 30

# Mouse: drag to move / resize
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# ---------------- Workspaces ----------------
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL, Left, workspace, r-1
bind = $mainMod CTRL, Right, workspace, r+1
bind = $mainMod CTRL, Down, workspace, empty
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Scratchpad
bind = $mainMod, S, togglespecialworkspace
bind = $mainMod SHIFT, S, movetoworkspace, special

# ---------------- Audio (wpctl, PipeWire) ----------------
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ---------------- Brightness ----------------
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ---------------- Media ----------------
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

# ---------------- Screenshots (grimblast: file + clipboard) ----------------
bind = , Print, exec, grimblast copysave area             # select area
bind = $mainMod, Print, exec, grimblast copysave output   # current monitor
bind = $mainMod SHIFT, Print, exec, grimblast copysave screen  # all monitors
bind = $mainMod, C, exec, hyprpicker -a                   # color to clipboard

# ---------------- Notifications (swaync) ----------------
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, N, exec, swaync-client -C -sw

# ---------------- System ----------------
bind = $mainMod, R, exec, hyprctl reload                  # reload Hyprland config
bind = $mainMod, X, exec, wlogout                          # power menu
bind = $mainMod SHIFT, Q, exit                             # logout to SDDM
